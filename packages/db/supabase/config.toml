project_id = "vabrato-apps"

[db]
port = 54322
major_version = 15

[api]
port = 54321
schemas = ["public", "storage"]

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3001", "http://localhost:3002", "http://localhost:3003/auth/callback"]

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Google OAuth: set client id/secret via `supabase secrets` or the dashboard;
# values here read from env so nothing secret lands in git.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
